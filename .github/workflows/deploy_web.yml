name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main # Change this if your default branch is different (e.g., 'master')

permissions:
  contents: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web App
        # The --base-href flag is CRITICAL for GitHub pages. 
        # It MUST match your repository name! E.g., if your repo is github.com/username/optimos, use "/optimos/"
        run: flutter build web --release --web-renderer canvaskit --base-href "/kaizen/"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
