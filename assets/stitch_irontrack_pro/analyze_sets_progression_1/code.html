<div class="flex items-center space-x-1">

<div class="flex justify-between items-center w-full pb-4">
<button class="w-10 h-10 rounded-full bg-surface-container-low flex items-center justify-center hover:bg-surface-container-high transition-colors text-secondary">

</button>
<h1 class="font-headline-md text-headline-md text-on-surface">Bench Press</h1>

<button class="w-10 h-10 rounded-full bg-surface-container-low flex items-center justify-center hover:bg-surface-container-high transition-colors text-secondary">

</button>

</div>
</div>

</button>
<button class="flex-1 py-2 px-4 rounded-full bg-on-surface text-background flex items-center justify-center space-x-2">

</button>

</div>

<div class="w-full h-px bg-secondary"></div>
<div class="w-full h-px bg-secondary"></div>
<div class="w-full h-px bg-secondary"></div>
</div>
