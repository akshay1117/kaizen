<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Date &amp; Time Picker</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary": "#303032",
                        "error": "#ffb4ab",
                        "outline": "#869584",
                        "surface-tint": "#53e16f",
                        "secondary-fixed-dim": "#c8c6c8",
                        "inverse-on-surface": "#303030",
                        "outline-variant": "#3d4a3c",
                        "surface-dim": "#131313",
                        "tertiary-container": "#afadaf",
                        "on-tertiary-container": "#414143",
                        "on-error-container": "#ffdad6",
                        "surface": "#131313",
                        "primary-container": "#34c759",
                        "inverse-primary": "#006e28",
                        "secondary-container": "#474649",
                        "secondary-fixed": "#e4e2e4",
                        "on-background": "#e2e2e2",
                        "on-secondary-fixed-variant": "#474649",
                        "on-surface": "#e2e2e2",
                        "surface-bright": "#393939",
                        "primary": "#56e472",
                        "on-primary-fixed": "#002107",
                        "inverse-surface": "#e2e2e2",
                        "on-primary-container": "#004d1a",
                        "surface-container-lowest": "#0e0e0e",
                        "tertiary-fixed-dim": "#c8c6c8",
                        "tertiary": "#cbc8cb",
                        "error-container": "#93000a",
                        "on-tertiary-fixed-variant": "#474649",
                        "background": "#131313",
                        "on-primary-fixed-variant": "#00531c",
                        "on-secondary-fixed": "#1b1b1d",
                        "surface-container-highest": "#353535",
                        "surface-container-low": "#1b1b1b",
                        "primary-fixed": "#72fe88",
                        "on-secondary-container": "#b6b4b7",
                        "surface-container-high": "#2a2a2a",
                        "on-surface-variant": "#bccbb8",
                        "surface-container": "#1f1f1f",
                        "primary-fixed-dim": "#53e16f",
                        "on-primary": "#003911",
                        "on-error": "#690005",
                        "surface-variant": "#353535",
                        "tertiary-fixed": "#e4e2e4",
                        "on-tertiary": "#303032",
                        "on-tertiary-fixed": "#1b1b1d",
                        "secondary": "#c8c6c8"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-padding": "16px",
                        "card-gap": "12px",
                        "xl": "32px",
                        "md": "16px",
                        "base": "4px",
                        "sm": "12px",
                        "lg": "24px",
                        "xs": "8px"
                    },
                    "fontFamily": {
                        "headline-md": ["Hanken Grotesk"],
                        "body-sm": ["Hanken Grotesk"],
                        "headline-lg-mobile": ["Hanken Grotesk"],
                        "headline-lg": ["Hanken Grotesk"],
                        "body-lg": ["Hanken Grotesk"],
                        "display-metrics": ["Hanken Grotesk"],
                        "label-caps": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["26px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "body-lg": ["17px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display-metrics": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 16px); }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background antialiased h-screen w-screen overflow-hidden flex flex-col justify-end">
<!-- Backdrop Dim -->
<div class="fixed inset-0 bg-black/70 z-40 transition-opacity"></div>
<!-- Bottom Sheet Container -->
<div class="relative bg-surface-container w-full max-w-md mx-auto rounded-t-[24px] rounded-tr-[24px] flex flex-col z-50 pt-sm pb-safe px-md shadow-[0_-8px_30px_rgba(0,0,0,0.5)] transform transition-transform">
<!-- Drag Handle (Optional but standard for bottom sheets) -->
<div class="w-12 h-1 bg-surface-variant rounded-full mx-auto mb-sm"></div>
<!-- Header Actions -->
<div class="flex items-center justify-between py-xs mb-sm">
<button aria-label="Cancel" class="w-11 h-11 flex items-center justify-center text-on-surface-variant hover:bg-surface-variant rounded-full transition-colors active:scale-95">
<span class="material-symbols-outlined text-[24px]" data-weight="regular">close</span>
</button>
<button aria-label="Save" class="w-11 h-11 flex items-center justify-center text-primary-container hover:bg-surface-variant rounded-full transition-colors active:scale-95">
<span class="material-symbols-outlined text-[24px]" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check</span>
</button>
</div>
<!-- Calendar Month/Year Header -->
<div class="flex items-center justify-between py-sm px-xs mb-md">
<button class="w-10 h-10 flex items-center justify-center text-on-surface-variant hover:text-on-surface transition-colors">
<span class="material-symbols-outlined">chevron_left</span>
</button>
<h2 class="font-headline-md text-headline-md text-on-surface">August 2026</h2>
<button class="w-10 h-10 flex items-center justify-center text-on-surface-variant hover:text-on-surface transition-colors">
<span class="material-symbols-outlined">chevron_right</span>
</button>
</div>
<!-- Calendar Grid -->
<div class="px-xs">
<!-- Days of Week -->
<div class="grid grid-cols-7 gap-y-2 mb-md text-center font-label-caps text-label-caps text-on-surface-variant">
<div>SUN</div>
<div>MON</div>
<div>TUE</div>
<div>WED</div>
<div>THU</div>
<div>FRI</div>
<div>SAT</div>
</div>
<!-- Dates -->
<div class="grid grid-cols-7 gap-y-sm text-center font-body-lg text-body-lg text-on-surface">
<!-- Empty cells for start of month (August 2026 starts on Saturday) -->
<div class="w-10 h-10 mx-auto"></div>
<div class="w-10 h-10 mx-auto"></div>
<div class="w-10 h-10 mx-auto"></div>
<div class="w-10 h-10 mx-auto"></div>
<div class="w-10 h-10 mx-auto"></div>
<div class="w-10 h-10 mx-auto"></div>
<!-- Day 1 -->
<button class="w-10 h-10 flex items-center justify-center rounded-full mx-auto hover:bg-surface-variant transition-colors">1</button>
<!-- Week 2 -->
<button class="w-10 h-10 flex items-center justify-center rounded-full mx-auto hover:bg-surface-variant transition-colors">2</button>
<button class="w-10 h-10 flex items-center justify-center rounded-full mx-auto hover:bg-surface-variant transition-colors">3</button>
<button class="w-10 h-10 flex items-center justify-center rounded-full mx-auto hover:bg-surface-variant transition-colors">4</button>
<button class="w-10 h-10 flex items-center justify-center rounded-full mx-auto hover:bg-surface-variant transition-colors">5</button>
<button class="w-10 h-10 flex items-center justify-center rounded-full mx-auto hover:bg-surface-variant transition-colors">6</button>
<button class="w-10 h-10 flex items-center justify-center rounded-full mx-auto hover:bg-surface-variant transition-colors">7</button>
<button class="w-10 h-10 flex items-center justify-center rounded-full mx-auto hover:bg-surface-variant transition-colors">8</button>
<!-- Week 3 -->
<button class="w-10 h-10 flex items-center justify-center rounded-full mx-auto hover:bg-surface-variant transition-colors">9</button>
<button class="w-10 h-10 flex items-center justify-center rounded-full mx-auto hover:bg-surface-variant transition-colors">10</button>
<button class="w-10 h-10 flex items-center justify-center rounded-full mx-auto hover:bg-surface-variant transition-colors">11</button>
<button class="w-10 h-10 flex items-center justify-center rounded-full mx-auto hover:bg-surface-variant transition-colors">12</button>
<button class="w-10 h-10 flex items-center justify-center rounded-full mx-auto hover:bg-surface-variant transition-colors">13</button>
<button class="w-10 h-10 flex items-center justify-center rounded-full mx-auto hover:bg-surface-variant transition-colors">14</button>
<!-- Selected Date -->
<button class="w-10 h-10 flex items-center justify-center rounded-full mx-auto bg-primary-container text-on-primary-fixed shadow-[0_0_12px_rgba(52,199,89,0.3)] transition-transform active:scale-95 font-headline-md">15</button>
<!-- Week 4 -->
<button class="w-10 h-10 flex items-center justify-center rounded-full mx-auto hover:bg-surface-variant transition-colors">16</button>
<button class="w-10 h-10 flex items-center justify-center rounded-full mx-auto hover:bg-surface-variant transition-colors">17</button>
<button class="w-10 h-10 flex items-center justify-center rounded-full mx-auto hover:bg-surface-variant transition-colors">18</button>
<button class="w-10 h-10 flex items-center justify-center rounded-full mx-auto hover:bg-surface-variant transition-colors">19</button>
<button class="w-10 h-10 flex items-center justify-center rounded-full mx-auto hover:bg-surface-variant transition-colors">20</button>
<button class="w-10 h-10 flex items-center justify-center rounded-full mx-auto hover:bg-surface-variant transition-colors">21</button>
<button class="w-10 h-10 flex items-center justify-center rounded-full mx-auto hover:bg-surface-variant transition-colors">22</button>
<!-- Week 5 -->
<button class="w-10 h-10 flex items-center justify-center rounded-full mx-auto hover:bg-surface-variant transition-colors text-on-surface-variant">23</button>
<button class="w-10 h-10 flex items-center justify-center rounded-full mx-auto hover:bg-surface-variant transition-colors text-on-surface-variant">24</button>
<button class="w-10 h-10 flex items-center justify-center rounded-full mx-auto hover:bg-surface-variant transition-colors text-on-surface-variant">25</button>
<button class="w-10 h-10 flex items-center justify-center rounded-full mx-auto hover:bg-surface-variant transition-colors text-on-surface-variant">26</button>
<button class="w-10 h-10 flex items-center justify-center rounded-full mx-auto hover:bg-surface-variant transition-colors text-on-surface-variant">27</button>
<button class="w-10 h-10 flex items-center justify-center rounded-full mx-auto hover:bg-surface-variant transition-colors text-on-surface-variant">28</button>
<button class="w-10 h-10 flex items-center justify-center rounded-full mx-auto hover:bg-surface-variant transition-colors text-on-surface-variant">29</button>
<!-- Week 6 (partial) -->
<button class="w-10 h-10 flex items-center justify-center rounded-full mx-auto hover:bg-surface-variant transition-colors text-on-surface-variant">30</button>
<button class="w-10 h-10 flex items-center justify-center rounded-full mx-auto hover:bg-surface-variant transition-colors text-on-surface-variant">31</button>
</div>
</div>
<!-- Footer: Time Selector -->
<div class="mt-xl pt-md border-t border-outline-variant flex items-center justify-between">
<span class="font-body-lg text-body-lg text-on-surface">Time</span>
<button class="bg-surface-variant px-lg py-xs rounded-full font-headline-md text-headline-md text-on-surface hover:bg-surface-container-highest transition-colors active:scale-95">
                5:19 PM
            </button>
</div>
</div>
</body></html>
