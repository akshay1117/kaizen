<div class="flex-1">
<div class="flex items-center space-x-xs mb-xs">
<span class="material-symbols-outlined text-primary text-[16px]" data-icon="timer">timer</span>
<span class="font-label-caps text-label-caps text-secondary uppercase">Bench Press</span>
</div>
<div class="font-headline-md text-headline-md text-on-surface mb-base">Next Set</div>
<div class="font-display-metrics text-display-metrics text-on-surface" style="font-size: 32px; line-height: 36px;">1:20</div>
</div>

<circle class="text-surface-variant stroke-current" cx="50" cy="50" fill="transparent" r="40" stroke-width="8"></circle>
<circle class="text-primary-container stroke-current progress-ring__circle transition-all duration-1000 ease-in-out" cx="50" cy="50" fill="transparent" r="40" stroke-linecap="round" stroke-width="8"></circle>
</svg>
<div class="absolute font-headline-md text-headline-md text-on-surface">3/4</div>
</div>
</div>
<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface text-center mb-base">

<p class="font-body-lg text-body-lg text-secondary text-center max-w-[280px]">
            Receive alerts. Live on lockscreen.
        </p>
</main>
