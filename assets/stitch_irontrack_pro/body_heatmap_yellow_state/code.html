<body class="bg-background text-on-surface font-body-lg flex flex-col min-h-screen antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Header (Derived from TopAppBar style intent, customized for context) -->
<header class="flex justify-between items-center w-full px-md h-14 z-50 bg-background sticky top-0">
<button class="text-primary hover:opacity-80 transition-opacity p-2 -ml-2 rounded-full">
<span class="material-symbols-outlined">refresh</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-on-surface tracking-tight">Body</h1>
<button class="text-primary hover:opacity-80 transition-opacity p-2 -mr-2 rounded-full">
<span class="material-symbols-outlined">add</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 px-md pb-24 overflow-y-auto">
<!-- Top Button: Weight -->
<div class="bg-surface-container-low rounded-lg p-sm flex items-center justify-between mb-lg border border-outline-variant cursor-pointer hover:bg-surface-container transition-colors shadow-sm">
<div class="flex items-center gap-sm">
<div class="w-8 h-8 rounded bg-surface-container-highest flex items-center justify-center border border-outline-variant/50">
<!-- Inline color for specifically requested purple, fitting the dark theme conceptually -->
<span class="material-symbols-outlined text-[20px]" style="color: #c084fc;">person</span>
</div>
<span class="font-headline-md text-headline-md text-on-surface">Weight</span>
</div>
<span class="material-symbols-outlined text-secondary text-[20px]">chevron_right</span>
</div>

<!-- Atmospheric gradient overlay -->
<div class="absolute inset-0 bg-gradient-to-t from-background via-transparent to-transparent pointer-events-none"></div>
</div>
<!-- Legend -->
<div class="flex justify-center gap-lg mb-xl">
<div class="flex items-center gap-xs">
<div class="w-2.5 h-2.5 rounded-full bg-error shadow-[0_0_8px_rgba(255,180,171,0.4)]"></div>
<span class="font-label-caps text-label-caps text-secondary">Just Trained</span>
</div>
<div class="flex items-center gap-xs">
<div class="w-2.5 h-2.5 rounded-full bg-primary shadow-[0_0_8px_rgba(86,228,114,0.4)]"></div>
<span class="font-label-caps text-label-caps text-secondary">Rested</span>
</div>
</div>
<!-- List Section -->
<div class="space-y-card-gap">

<div class="flex items-center gap-sm">
<div class="w-8 h-8 rounded-full flex items-center justify-center" style="background-color: rgba(217, 119, 6, 0.2);">

</div>
<span class="font-headline-md text-headline-md" style="color: #fcd34d;">Unassigned Exercises</span>

<div class="flex items-center gap-xs">

<div class="w-2.5 h-2.5 rounded-full shadow-[0_0_8px_rgba(250,204,21,0.5)]" style="background-color: #facc15;"></div>
<span class="font-headline-md text-headline-md text-on-surface">Chest</span>
</div>
<div class="flex items-center gap-1 text-secondary">
<span class="font-body-sm text-body-sm mt-0.5">Yesterday</span>

</div>

<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-16 pb-safe px-4 bg-surface-container border-t border-outline-variant backdrop-blur-md bg-opacity-95">

<div class="flex flex-col items-center justify-center w-16 h-full text-secondary hover:bg-surface-variant/20 rounded-lg cursor-pointer transition-colors">
<span class="material-symbols-outlined text-[24px]">fitness_center</span>
<span class="font-label-caps text-[10px] mt-1">Sets</span>
</div>
<!-- Sessions (Inactive) -->
<div class="flex flex-col items-center justify-center w-16 h-full text-secondary hover:bg-surface-variant/20 rounded-lg cursor-pointer transition-colors">
<span class="material-symbols-outlined text-[24px]">history</span>
<span class="font-label-caps text-[10px] mt-1">Sessions</span>
</div>
<!-- Body (Active) -->
<div class="flex flex-col items-center justify-center w-16 h-full text-primary scale-95 transition-transform duration-200 cursor-default">
<!-- Utilizing font-variation-settings for the 'FILL' as per Material Symbols rules for active states -->
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="font-label-caps text-[10px] mt-1 font-bold">Body</span>
</div>
<!-- Today (Inactive) -->
<div class="flex flex-col items-center justify-center w-16 h-full text-secondary hover:bg-surface-variant/20 rounded-lg cursor-pointer transition-colors">
