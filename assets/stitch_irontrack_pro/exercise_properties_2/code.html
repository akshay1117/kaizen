<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Exercise Properties</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-fixed": "#e4e2e4",
                        "on-tertiary": "#303032",
                        "outline-variant": "#3d4a3c",
                        "on-error": "#690005",
                        "surface-container": "#1f1f1f",
                        "on-secondary-fixed": "#1b1b1d",
                        "surface-container-highest": "#353535",
                        "tertiary": "#cbc8cb",
                        "on-surface": "#e2e2e2",
                        "tertiary-container": "#afadaf",
                        "primary-fixed": "#72fe88",
                        "on-surface-variant": "#bccbb8",
                        "surface-dim": "#131313",
                        "primary-fixed-dim": "#53e16f",
                        "secondary-container": "#474649",
                        "on-secondary-fixed-variant": "#474649",
                        "outline": "#869584",
                        "surface-container-high": "#2a2a2a",
                        "error": "#ffb4ab",
                        "background": "#131313",
                        "inverse-on-surface": "#303030",
                        "on-tertiary-container": "#414143",
                        "secondary": "#c8c6c8",
                        "on-tertiary-fixed": "#1b1b1d",
                        "on-secondary-container": "#b6b4b7",
                        "on-primary-fixed-variant": "#00531c",
                        "surface-tint": "#53e16f",
                        "on-background": "#e2e2e2",
                        "secondary-fixed": "#e4e2e4",
                        "error-container": "#93000a",
                        "on-tertiary-fixed-variant": "#474649",
                        "inverse-surface": "#e2e2e2",
                        "on-primary-fixed": "#002107",
                        "on-secondary": "#303032",
                        "surface": "#131313",
                        "secondary-fixed-dim": "#c8c6c8",
                        "on-primary": "#003911",
                        "on-primary-container": "#004d1a",
                        "surface-container-low": "#1b1b1b",
                        "surface-container-lowest": "#0e0e0e",
                        "surface-variant": "#353535",
                        "primary": "#56e472",
                        "on-error-container": "#ffdad6",
                        "inverse-primary": "#006e28",
                        "primary-container": "#34c759",
                        "surface-bright": "#393939",
                        "tertiary-fixed-dim": "#c8c6c8"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base": "4px",
                        "container-padding": "16px",
                        "xl": "32px",
                        "lg": "24px",
                        "sm": "12px",
                        "xs": "8px",
                        "card-gap": "12px",
                        "md": "16px"
                    },
                    "fontFamily": {
                        "body-sm": ["Hanken Grotesk"],
                        "body-lg": ["Hanken Grotesk"],
                        "headline-md": ["Hanken Grotesk"],
                        "display-metrics": ["Hanken Grotesk"],
                        "headline-lg-mobile": ["Hanken Grotesk"],
                        "label-caps": ["Hanken Grotesk"],
                        "headline-lg": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "body-lg": ["17px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "display-metrics": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "headline-lg-mobile": ["26px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .toggle-checkbox:checked {
            right: 0;
            border-color: #34c759;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #34c759;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-body-lg min-h-screen antialiased flex items-end justify-center relative overflow-hidden">
<!-- Background Dimming Layer -->
<div class="absolute inset-0 bg-black/70 z-0"></div>
<!-- Bottom Sheet Modal -->
<div class="relative z-10 w-full max-w-md bg-surface-container rounded-t-[32px] overflow-hidden border-t border-surface-container-highest shadow-2xl pb-8 animate-[slideUp_0.3s_ease-out]">
<!-- Drag Handle -->
<div class="flex justify-center pt-3 pb-1">
<div class="w-10 h-1 bg-surface-variant rounded-full"></div>
</div>
<!-- Header -->
<div class="flex items-center justify-between px-md py-sm">
<button class="w-10 h-10 flex items-center justify-center text-on-surface hover:bg-surface-variant rounded-full transition-colors">
<span class="material-symbols-outlined text-[24px]">close</span>
</button>
<div class="text-center">
<h2 class="font-headline-md text-headline-md text-on-surface">Properties</h2>
<p class="font-body-sm text-body-sm text-secondary">Bench Press</p>
</div>
<button class="w-10 h-10 flex items-center justify-center bg-primary-container text-on-primary-container rounded-full shadow-lg">
<span class="material-symbols-outlined text-[24px]">check</span>
</button>
</div>
<!-- Content -->
<div class="px-md mt-lg">
<h3 class="font-headline-md text-headline-md text-secondary mb-sm">Tracked Metrics</h3>
<div class="bg-surface-container-low rounded-xl border border-surface-container-highest overflow-hidden">
<!-- Duration Row -->
<div class="flex items-center justify-between p-sm border-b border-surface-container-highest h-[56px]">
<div class="flex items-center gap-sm">
<div class="w-[32px] h-[32px] bg-surface-container-high rounded-lg flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">timer</span>
</div>
<span class="font-body-lg text-body-lg">Duration</span>
</div>
<!-- iOS Style Toggle -->
<div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
<input class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer transition-all duration-300 ease-in-out border-surface-container-high z-10 top-0 left-0 checked:left-6 checked:border-primary-container" id="toggle-duration" name="toggle" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-6 rounded-full bg-surface-container-high cursor-pointer transition-colors duration-300 ease-in-out" for="toggle-duration"></label>
</div>
</div>
<!-- Repetitions Row -->
<div class="flex items-center justify-between p-sm border-b border-surface-container-highest h-[56px]">
<div class="flex items-center gap-sm">
<div class="w-[32px] h-[32px] bg-surface-container-high rounded-lg flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">tag</span>
</div>
<span class="font-body-lg text-body-lg">Repetitions</span>
</div>
<!-- iOS Style Toggle -->
<div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
<input checked="" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer transition-all duration-300 ease-in-out border-primary-container z-10 top-0 left-6" id="toggle-reps" name="toggle" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-6 rounded-full bg-primary-container cursor-pointer transition-colors duration-300 ease-in-out" for="toggle-reps"></label>
</div>
</div>
<!-- Weight Row -->
<div class="flex items-center justify-between p-sm h-[56px]">
<div class="flex items-center gap-sm">
<div class="w-[32px] h-[32px] bg-surface-container-high rounded-lg flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">weight</span>
</div>
<span class="font-body-lg text-body-lg">Weight</span>
</div>
<!-- iOS Style Toggle -->
<div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
<input checked="" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer transition-all duration-300 ease-in-out border-primary-container z-10 top-0 left-6" id="toggle-weight" name="toggle" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-6 rounded-full bg-primary-container cursor-pointer transition-colors duration-300 ease-in-out" for="toggle-weight"></label>
</div>
</div>
</div>
<!-- Footer Text -->
<p class="font-body-sm text-body-sm text-secondary mt-sm px-xs">
                Only the metrics you enable are captured when recording sets, and they shape what's shown in this exercise's history and analytics.
            </p>
</div>
</div>
<style>
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
    </style>
</body></html>
