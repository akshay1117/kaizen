<body class="antialiased pb-24">
<!-- Top App Bar -->
<header class="bg-background dark:bg-background flex justify-between items-center w-full px-md py-xs sticky top-0 z-10">
<button class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center hover:bg-surface-container-high transition-colors text-primary dark:text-primary">
<span class="material-symbols-outlined">arrow_back_ios_new</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Bench Press</h1>
<div class="flex gap-xs">
<button class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center hover:bg-surface-container-high transition-colors text-primary dark:text-primary">
<span class="material-symbols-outlined">sort</span>
</button>
<button class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center hover:bg-surface-container-high transition-colors text-primary dark:text-primary">
<span class="material-symbols-outlined">more_horiz</span>
</button>
</div>
</header>
<!-- Sub Navigation Pill -->
<div class="px-md py-sm flex justify-center gap-2">
<button class="flex items-center gap-1 px-4 py-2 rounded-full bg-surface-container text-secondary hover:bg-surface-container-high transition-colors font-body-sm">
<span class="material-symbols-outlined text-sm">fitness_center</span>
            Sets
        </button>
<button class="flex items-center gap-1 px-6 py-2 rounded-full bg-white text-black font-body-sm font-bold shadow-lg">
<span class="material-symbols-outlined text-sm">show_chart</span>
            Analyze
        </button>
<button class="flex items-center gap-1 px-4 py-2 rounded-full bg-surface-container text-secondary hover:bg-surface-container-high transition-colors font-body-sm">
<span class="material-symbols-outlined text-sm">military_tech</span>
            1RM
        </button>
</div>
<!-- Main Content Canvas -->
<main class="px-md flex flex-col gap-lg mt-4">
<!-- Metric Cards -->
<div class="grid grid-cols-4 gap-2">
<div class="bg-surface-container rounded-lg p-2 flex flex-col items-center justify-center text-center">
<span class="font-body-lg text-secondary">25</span>
<span class="font-body-sm text-secondary">kg/rep</span>
</div>
<div class="bg-surface-container rounded-lg p-2 flex flex-col items-center justify-center text-center">
<span class="font-body-lg text-secondary">2.5</span>
<span class="font-body-sm text-secondary">Sets</span>
</div>
<div class="bg-surface-container rounded-lg p-2 flex flex-col items-center justify-center text-center">
<span class="font-body-lg text-secondary">30</span>
<span class="font-body-sm text-secondary">rep</span>
</div>
<div class="bg-[#00E5FF] rounded-lg p-2 flex flex-col items-center justify-center text-center shadow-[0_0_15px_rgba(0,229,255,0.3)]">
<span class="font-body-lg text-black font-bold">750 kg</span>
<span class="font-body-sm text-black font-semibold">Volume</span>
</div>
</div>
<!-- Chart Area -->
<div class="flex flex-col gap-2 mt-4">
<div class="flex justify-between items-center text-secondary font-label-caps">
<span>AVERAGE</span>
<span>15 Jul - 14 Aug 2026</span>
</div>
<div class="relative h-64 w-full grid-bg mt-2">
<!-- Y-Axis Labels (Right) -->
<div class="absolute right-0 top-0 h-full flex flex-col justify-between text-right text-xs text-secondary pointer-events-none pb-6">
<span>1,500</span>
<span>1,000</span>
<span>500</span>
<span>0</span>
</div>
<!-- X-Axis Labels (Bottom) -->
<div class="absolute bottom-0 w-full flex justify-between text-xs text-secondary pt-2 border-t border-[#2C2C2E]">
<span class="w-1/5 text-center">26</span>
<span class="w-1/5 text-center">2</span>
<span class="w-1/5 text-center">9</span>
<span class="w-1/5 text-center">16</span>
<span class="w-1/5 text-center">23</span>
</div>
<!-- Bars -->
<div class="absolute inset-0 flex items-end pb-8">
<div class="w-1/5 flex justify-center h-full items-end">
<div class="w-3 bg-[#00E5FF] rounded-t-sm" style="height: 65%;"></div>
</div>
<div class="w-1/5 flex justify-center h-full items-end">
<div class="w-3 bg-[#00E5FF] rounded-t-sm" style="height: 25%;"></div>
</div>
<div class="w-1/5 flex justify-center h-full items-end"></div>
<div class="w-1/5 flex justify-center h-full items-end"></div>
<div class="w-1/5 flex justify-center h-full items-end"></div>
</div>
</div>
</div>

<button class="flex-1 py-2 text-center rounded-full bg-surface-variant text-white font-body-sm">M</button>
<button class="flex-1 py-2 text-center rounded-full text-secondary font-body-sm">6M</button>
<button class="flex-1 py-2 text-center rounded-full text-secondary font-body-sm">Y</button>
</div>

<div class="flex bg-surface-container rounded-full p-1 mt-4">
<button class="flex-1 py-2 text-center rounded-full text-secondary font-body-sm">Sets</button>
<button class="flex-1 py-2 text-center rounded-full bg-surface-variant text-white font-body-sm">Stats</button>
