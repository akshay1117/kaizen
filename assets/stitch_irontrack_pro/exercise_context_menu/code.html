<!-- Bottom Navigation Shell (Suppressed based on contextual relevance, but keeping structural space) -->
<!-- Not rendering Bottom Nav as this represents a focused state/overlay within a specific view -->
<script>
        // Simple script to handle dismissal of the context menu to demonstrate the interaction state
        document.addEventListener('DOMContentLoaded', () => {
            const scrim = document.getElementById('scrim');
            const menu = document.getElementById('contextMenu');
            const trigger = document.getElementById('contextMenuTrigger');

            // Function to close the menu
            const closeMenu = () => {
                menu.classList.remove('scale-100', 'opacity-100');
                menu.classList.add('scale-95', 'opacity-0', 'pointer-events-none');
                
                scrim.classList.remove('opacity-100');
                scrim.classList.add('opacity-0', 'pointer-events-none');
                
                // Optional: remove after transition
                setTimeout(() => {
                    scrim.style.display = 'none';
                }, 300);
            };

            // Allow clicking scrim to close
            scrim.addEventListener('click', (e) => {
                if (e.target === scrim) {
                    closeMenu();
                }
            });

            // Re-open (for demo purposes if someone clicks the trigger in the background)
            trigger.addEventListener('click', () => {
                scrim.style.display = 'flex';
                // Trigger reflow
                void scrim.offsetWidth;
                
                scrim.classList.remove('opacity-0', 'pointer-events-none');
                scrim.classList.add('opacity-100');
                
                menu.classList.remove('scale-95', 'opacity-0', 'pointer-events-none');
                menu.classList.add('scale-100', 'opacity-100');
            });
        });
    </script>
