<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Workout - Analyze</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary": "#303032",
                        "on-secondary-container": "#b6b4b7",
                        "surface-container-lowest": "#0e0e0e",
                        "on-secondary-fixed-variant": "#474649",
                        "primary": "#56e472",
                        "secondary-container": "#474649",
                        "on-surface": "#e2e2e2",
                        "on-tertiary-container": "#414143",
                        "on-tertiary-fixed": "#1b1b1d",
                        "secondary": "#c8c6c8",
                        "on-primary": "#003911",
                        "primary-fixed-dim": "#53e16f",
                        "on-tertiary": "#303032",
                        "on-primary-container": "#004d1a",
                        "surface-container-high": "#2a2a2a",
                        "on-secondary-fixed": "#1b1b1d",
                        "tertiary-fixed-dim": "#c8c6c8",
                        "tertiary": "#cbc8cb",
                        "surface-dim": "#131313",
                        "surface-variant": "#353535",
                        "on-surface-variant": "#bccbb8",
                        "inverse-primary": "#006e28",
                        "tertiary-fixed": "#e4e2e4",
                        "secondary-fixed": "#e4e2e4",
                        "inverse-on-surface": "#303030",
                        "outline": "#869584",
                        "surface-container-highest": "#353535",
                        "tertiary-container": "#afadaf",
                        "surface-tint": "#53e16f",
                        "surface-container": "#1f1f1f",
                        "on-error": "#690005",
                        "error-container": "#93000a",
                        "outline-variant": "#3d4a3c",
                        "on-background": "#e2e2e2",
                        "on-error-container": "#ffdad6",
                        "background": "#131313",
                        "surface": "#131313",
                        "on-tertiary-fixed-variant": "#474649",
                        "inverse-surface": "#e2e2e2",
                        "surface-container-low": "#1b1b1b",
                        "primary-fixed": "#72fe88",
                        "on-primary-fixed": "#002107",
                        "error": "#ffb4ab",
                        "primary-container": "#34c759",
                        "secondary-fixed-dim": "#c8c6c8",
                        "surface-bright": "#393939",
                        "on-primary-fixed-variant": "#00531c"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base": "4px",
                        "md": "16px",
                        "card-gap": "12px",
                        "container-padding": "16px",
                        "xs": "8px",
                        "lg": "24px",
                        "xl": "32px",
                        "sm": "12px"
                    },
                    "fontFamily": {
                        "label-caps": ["Hanken Grotesk"],
                        "headline-lg": ["Hanken Grotesk"],
                        "body-sm": ["Hanken Grotesk"],
                        "body-lg": ["Hanken Grotesk"],
                        "display-metrics": ["Hanken Grotesk"],
                        "headline-lg-mobile": ["Hanken Grotesk"],
                        "headline-md": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "body-lg": ["17px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display-metrics": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "headline-lg-mobile": ["26px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        /* Hide scrollbar for clean aesthetic */
        ::-webkit-scrollbar { display: none; }
        body { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Custom graph animation */
        @keyframes drawLine {
            to { stroke-dashoffset: 0; }
        }
        .animated-line {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: drawLine 1.5s ease-out forwards;
        }
        
        .accent-orange { color: #FF9500; }
        .bg-accent-orange { background-color: #FF9500; }
        .stroke-accent-orange { stroke: #FF9500; }
        
        .accent-green { color: #34C759; }
        .bg-accent-green { background-color: #34C759; }
        .stroke-accent-green { stroke: #34C759; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface h-screen flex flex-col font-body-lg">
<!-- TopAppBar -->
<header class="flex justify-between items-center w-full px-md h-14 z-50 bg-background dark:bg-background flat no shadows">
<button class="w-10 h-10 flex items-center justify-center text-primary dark:text-primary hover:opacity-80 transition-opacity active:scale-95 transition-transform duration-150">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">chevron_left</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-on-surface dark:text-on-surface">Bench Press</h1>
<div class="flex items-center gap-2 text-primary dark:text-primary">
<button class="w-10 h-10 flex items-center justify-center hover:opacity-80 transition-opacity active:scale-95 transition-transform duration-150">
<span class="material-symbols-outlined">filter_list</span>
</button>
<button class="w-10 h-10 flex items-center justify-center hover:opacity-80 transition-opacity active:scale-95 transition-transform duration-150">
<span class="material-symbols-outlined">more_horiz</span>
</button>
</div>
</header>
<!-- Main Canvas -->
<main class="flex-1 overflow-y-auto px-md pb-24 flex flex-col gap-lg">
<!-- Segmented Control Sub-nav -->
<div class="bg-surface-container rounded-lg p-1 flex">
<button class="flex-1 py-2 font-body-sm text-body-sm text-secondary text-center rounded-DEFAULT hover:bg-surface-variant/50 transition-colors">Sets</button>
<button class="flex-1 py-2 font-body-sm text-body-sm text-on-surface bg-surface-variant rounded-DEFAULT shadow-sm text-center">Analyze</button>
<button class="flex-1 py-2 font-body-sm text-body-sm text-secondary text-center rounded-DEFAULT hover:bg-surface-variant/50 transition-colors">1RM</button>
</div>
<!-- Data Header -->
<div class="flex flex-col gap-xs mt-sm">
<div class="flex items-baseline gap-md">
<div class="flex items-baseline gap-1">
<span class="font-display-metrics text-display-metrics accent-green">12</span>
<span class="font-headline-md text-headline-md accent-green">rep</span>
</div>
<div class="flex items-baseline gap-1">
<span class="font-display-metrics text-display-metrics accent-orange">35</span>
<span class="font-headline-md text-headline-md accent-orange">kg</span>
</div>
</div>
<p class="font-body-sm text-body-sm text-secondary">Last Set: 03/08/26, 12:16 AM</p>
</div>
<!-- Chart Area -->
<div class="bg-surface-container rounded-xl p-md h-64 relative border border-outline-variant flex items-center justify-center overflow-hidden">
<!-- Simulated Graph using SVG -->
<svg class="w-full h-full" preserveaspectratio="none" viewbox="0 0 400 200">
<!-- Grid Lines -->
<line stroke="#353535" stroke-dasharray="4" stroke-width="1" x1="0" x2="400" y1="50" y2="50"></line>
<line stroke="#353535" stroke-dasharray="4" stroke-width="1" x1="0" x2="400" y1="100" y2="100"></line>
<line stroke="#353535" stroke-dasharray="4" stroke-width="1" x1="0" x2="400" y1="150" y2="150"></line>
<!-- Green Baseline (Reps) -->
<path class="stroke-accent-green animated-line" d="M 0,160 L 80,140 L 160,170 L 240,150 L 320,130 L 400,160" fill="none" stroke-width="3"></path>
<!-- Orange Trend (Weight) -->
<path class="stroke-accent-orange animated-line" d="M 0,120 L 80,90 L 160,110 L 240,60 L 320,80 L 400,40" fill="none" stroke-width="3"></path>
<!-- Data Points (Orange) -->
<circle class="stroke-accent-orange" cx="80" cy="90" fill="#1f1f1f" r="4" stroke-width="2"></circle>
<circle class="stroke-accent-orange" cx="160" cy="110" fill="#1f1f1f" r="4" stroke-width="2"></circle>
<circle class="stroke-accent-orange" cx="240" cy="60" fill="#1f1f1f" r="4" stroke-width="2"></circle>
<circle class="stroke-accent-orange" cx="320" cy="80" fill="#1f1f1f" r="4" stroke-width="2"></circle>
<circle class="stroke-accent-orange" cx="400" cy="40" fill="#1f1f1f" r="4" stroke-width="2"></circle>
</svg>
<!-- Contextual Overlay Data (Simulated interaction state) -->
<div class="absolute right-0 top-8 bg-surface-variant p-2 rounded-lg border border-outline-variant shadow-lg flex flex-col gap-1 items-end opacity-0 hover:opacity-100 transition-opacity duration-300">
<span class="font-body-sm text-body-sm font-bold text-on-surface">Session 5</span>
<span class="font-label-caps text-label-caps accent-orange">35 KG</span>
<span class="font-label-caps text-label-caps accent-green">12 REPS</span>
</div>
</div>
<!-- Controls -->
<div class="flex flex-col gap-md mt-auto">
<div class="bg-surface-container rounded-lg p-1 flex">
<button class="flex-1 py-2 font-body-sm text-body-sm text-on-surface bg-surface-variant rounded-DEFAULT shadow-sm text-center">Last 2 Sessions</button>
<button class="flex-1 py-2 font-body-sm text-body-sm text-secondary text-center rounded-DEFAULT hover:bg-surface-variant/50 transition-colors">All</button>
</div>
<div class="bg-surface-container rounded-lg p-1 flex">
<button class="flex-1 py-2 font-body-sm text-body-sm text-on-surface bg-surface-variant rounded-DEFAULT shadow-sm text-center">Sets</button>
<button class="flex-1 py-2 font-body-sm text-body-sm text-secondary text-center rounded-DEFAULT hover:bg-surface-variant/50 transition-colors">Stats</button>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-16 pb-safe px-4 bg-surface-container dark:bg-surface-container border-t border-outline-variant dark:border-outline-variant flat no shadows">
<button class="flex flex-col items-center justify-center text-primary dark:text-primary hover:bg-surface-variant/20 active:scale-90 transition-transform duration-200 p-2 rounded-lg flex-1">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">fitness_center</span>
<span class="font-label-caps text-label-caps">Sets</span>
</button>
<button class="flex flex-col items-center justify-center text-secondary dark:text-secondary hover:bg-surface-variant/20 transition-colors p-2 rounded-lg flex-1">
<span class="material-symbols-outlined mb-1">history</span>
<span class="font-label-caps text-label-caps">Sessions</span>
</button>
<button class="flex flex-col items-center justify-center text-secondary dark:text-secondary hover:bg-surface-variant/20 transition-colors p-2 rounded-lg flex-1">
<span class="material-symbols-outlined mb-1">person</span>
<span class="font-label-caps text-label-caps">Body</span>
</button>
<button class="flex flex-col items-center justify-center text-secondary dark:text-secondary hover:bg-surface-variant/20 transition-colors p-2 rounded-lg flex-1">
<span class="material-symbols-outlined mb-1">calendar_today</span>
<span class="font-label-caps text-label-caps">Today</span>
</button>
</nav>
<!-- Safe area padding for bottom nav on mobile -->
<style>
        @supports (padding-bottom: env(safe-area-inset-bottom)) {
            .pb-safe {
                padding-bottom: calc(env(safe-area-inset-bottom) + 0.5rem);
            }
        }
    </style>
</body></html>
