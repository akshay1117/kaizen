<script>
        // Simple interaction script to toggle checkmark on add buttons
        document.querySelectorAll('button:not(header button)').forEach(btn => {
            btn.addEventListener('click', function(e) {
                // Prevent row click if clicking button directly
                e.stopPropagation();
                const iconSpan = this.querySelector('.material-symbols-outlined');
                if (iconSpan && (iconSpan.textContent === 'add_circle' || iconSpan.textContent === 'check_circle')) {
                    if (iconSpan.textContent === 'add_circle') {
                        iconSpan.textContent = 'check_circle';
                        iconSpan.setAttribute('data-weight', 'fill');
                        iconSpan.style.fontVariationSettings = "'FILL' 1";
                        this.closest('.h-\\[56px\\]').classList.add('bg-surface-variant/50');
                    } else {
                        iconSpan.textContent = 'add_circle';
                        iconSpan.removeAttribute('data-weight');
                        iconSpan.style.fontVariationSettings = "";
                        this.closest('.h-\\[56px\\]').classList.remove('bg-surface-variant/50');
                    }
                }
            });
        });
        
        // Allow row click to trigger button click
        document.querySelectorAll('.h-\\[56px\\]').forEach(row => {
            row.addEventListener('click', function() {
                const btn = this.querySelector('button');
                if (btn) btn.click();
            });
        });
    </script>
