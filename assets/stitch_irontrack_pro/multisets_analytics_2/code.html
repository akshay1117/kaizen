<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Workout Tracker - Multisets &amp; Analytics</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-fixed": "#e4e2e4",
                        "on-tertiary": "#303032",
                        "outline-variant": "#3d4a3c",
                        "on-error": "#690005",
                        "surface-container": "#1f1f1f",
                        "on-secondary-fixed": "#1b1b1d",
                        "surface-container-highest": "#353535",
                        "tertiary": "#cbc8cb",
                        "on-surface": "#e2e2e2",
                        "tertiary-container": "#afadaf",
                        "primary-fixed": "#72fe88",
                        "on-surface-variant": "#bccbb8",
                        "surface-dim": "#131313",
                        "primary-fixed-dim": "#53e16f",
                        "secondary-container": "#474649",
                        "on-secondary-fixed-variant": "#474649",
                        "outline": "#869584",
                        "surface-container-high": "#2a2a2a",
                        "error": "#ffb4ab",
                        "background": "#131313",
                        "inverse-on-surface": "#303030",
                        "on-tertiary-container": "#414143",
                        "secondary": "#c8c6c8",
                        "on-tertiary-fixed": "#1b1b1d",
                        "on-secondary-container": "#b6b4b7",
                        "on-primary-fixed-variant": "#00531c",
                        "surface-tint": "#53e16f",
                        "on-background": "#e2e2e2",
                        "secondary-fixed": "#e4e2e4",
                        "error-container": "#93000a",
                        "on-tertiary-fixed-variant": "#474649",
                        "inverse-surface": "#e2e2e2",
                        "on-primary-fixed": "#002107",
                        "on-secondary": "#303032",
                        "surface": "#131313",
                        "secondary-fixed-dim": "#c8c6c8",
                        "on-primary": "#003911",
                        "on-primary-container": "#004d1a",
                        "surface-container-low": "#1b1b1b",
                        "surface-container-lowest": "#0e0e0e",
                        "surface-variant": "#353535",
                        "primary": "#56e472",
                        "on-error-container": "#ffdad6",
                        "inverse-primary": "#006e28",
                        "primary-container": "#34c759",
                        "surface-bright": "#393939",
                        "tertiary-fixed-dim": "#c8c6c8",
                        "brand-orange": "#FF9500",
                        "brand-red": "#FF3B30",
                        "brand-red-light": "#FF6B64",
                        "chart-grid": "#333333"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base": "4px",
                        "container-padding": "16px",
                        "xl": "32px",
                        "lg": "24px",
                        "sm": "12px",
                        "xs": "8px",
                        "card-gap": "12px",
                        "md": "16px",
                        "nav-height": "80px"
                    },
                    "fontFamily": {
                        "body-sm": ["Hanken Grotesk"],
                        "body-lg": ["Hanken Grotesk"],
                        "headline-md": ["Hanken Grotesk"],
                        "display-metrics": ["Hanken Grotesk"],
                        "headline-lg-mobile": ["Hanken Grotesk"],
                        "label-caps": ["Hanken Grotesk"],
                        "headline-lg": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "body-lg": ["17px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "display-metrics": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                        "headline-lg-mobile": ["26px", {"lineHeight": "32px", "fontWeight": "700"}],
                        "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700"}]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #000;
            color: #fff;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Hide scrollbar for clean UI */
        ::-webkit-scrollbar {
            display: none;
        }
        
        /* Modal Backdrop Blur */
        .modal-backdrop {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
        }

        /* Segmented Control styles */
        .segmented-control input:checked + label {
            background-color: #353535;
            color: #fff;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-body-lg text-on-surface antialiased bg-black overflow-hidden flex h-screen w-full justify-center md:bg-surface-container-lowest">
<!-- Mobile Container Wrapper to simulate App View on Desktop -->
<div class="relative w-full h-full max-w-[428px] bg-background flex flex-col md:rounded-3xl md:overflow-hidden md:h-[795px] md:my-auto md:border md:border-surface-variant md:shadow-2xl">
<!-- Header -->
<header class="flex justify-between items-center w-full px-md py-xs bg-background z-10 pt-4 md:pt-xs">
<button class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface hover:bg-surface-container-highest transition-colors">
<span class="material-symbols-outlined text-[24px]">chevron_left</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface text-center flex-1">Bench Press</h1>
<div class="flex items-center gap-2">
<button class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface hover:bg-surface-container-highest transition-colors">
<span class="material-symbols-outlined text-[24px]">sort</span>
</button>
<button class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface hover:bg-surface-container-highest transition-colors">
<span class="material-symbols-outlined text-[24px]">more_horiz</span>
</button>
</div>
</header>
<!-- Main Tab Navigation -->
<div class="px-md py-2 flex gap-2">
<button class="flex-1 rounded-full bg-surface-container-high py-2 px-4 flex items-center justify-center gap-2 text-on-surface text-body-sm font-semibold hover:bg-surface-container-highest transition-colors">
<span class="material-symbols-outlined text-[18px]">format_list_bulleted</span> Sets
            </button>
<button class="flex-1 rounded-full bg-on-surface py-2 px-4 flex items-center justify-center gap-2 text-background text-body-sm font-semibold">
<span class="material-symbols-outlined text-[18px] text-background">monitoring</span> Analyze
            </button>
<button class="flex-1 rounded-full bg-surface-container-high py-2 px-4 flex items-center justify-center gap-2 text-on-surface text-body-sm font-semibold hover:bg-surface-container-highest transition-colors">
<span class="material-symbols-outlined text-[18px]">fitness_center</span> 1RM
            </button>
</div>
<!-- Scrollable Content Area -->
<main class="flex-1 overflow-y-auto pb-nav-height">
<!-- Metrics Grid -->
<div class="px-md py-4 grid grid-cols-4 gap-2">
<!-- Active Metric -->
<div class="bg-brand-orange bg-opacity-20 rounded-xl p-3 flex flex-col items-center justify-center text-center border border-brand-orange border-opacity-30">
<span class="text-brand-orange font-headline-md text-headline-md">25</span>
<span class="text-brand-orange text-[11px] font-semibold tracking-wide">kg/rep</span>
</div>
<!-- Inactive Metrics -->
<div class="bg-surface-container-high rounded-xl p-3 flex flex-col items-center justify-center text-center">
<span class="text-secondary font-headline-md text-headline-md">2.5</span>
<span class="text-secondary text-[11px] font-semibold tracking-wide">Sets</span>
</div>
<div class="bg-surface-container-high rounded-xl p-3 flex flex-col items-center justify-center text-center">
<span class="text-secondary font-headline-md text-headline-md">30</span>
<span class="text-secondary text-[11px] font-semibold tracking-wide">rep</span>
</div>
<div class="bg-surface-container-high rounded-xl p-3 flex flex-col items-center justify-center text-center">
<span class="text-secondary font-body-lg text-body-lg font-semibold leading-tight pt-1">750 kg</span>
<span class="text-secondary text-[11px] font-semibold tracking-wide mt-1">Volume</span>
</div>
</div>
<!-- Chart Section Header -->
<div class="px-md pt-2 pb-4 flex justify-between items-end">
<h2 class="text-secondary text-label-caps font-label-caps uppercase tracking-wider">DAILY AVERAGE</h2>
<span class="text-secondary text-[12px]">Dec 2025 - Dec 2026</span>
</div>
<!-- Bar Chart Area (Simulated) -->
<div class="px-md h-[220px] relative w-full mb-6">
<!-- Grid Lines -->
<div class="absolute inset-0 flex flex-col justify-between pointer-events-none px-md pb-6 pt-2">
<div class="border-t border-chart-grid border-dashed w-full flex justify-end items-start relative h-full">
<span class="text-secondary text-[10px] absolute -right-0 -top-2">40</span>
</div>
<div class="border-t border-chart-grid border-dashed w-full flex justify-end items-start relative h-full">
<span class="text-secondary text-[10px] absolute -right-0 -top-2">30</span>
</div>
<div class="border-t border-chart-grid border-dashed w-full flex justify-end items-start relative h-full">
<span class="text-secondary text-[10px] absolute -right-0 -top-2">20</span>
</div>
<div class="border-t border-chart-grid border-dashed w-full flex justify-end items-start relative h-full">
<span class="text-secondary text-[10px] absolute -right-0 -top-2">10</span>
</div>
<div class="border-t border-chart-grid w-full flex justify-end items-start relative">
<span class="text-secondary text-[10px] absolute -right-0 -top-2">0</span>
</div>
</div>
<!-- Vertical Grid Lines (Months) -->
<div class="absolute inset-x-md bottom-6 top-2 flex justify-between pointer-events-none">
<div class="border-l border-chart-grid border-dashed h-full"></div>
<div class="border-l border-chart-grid border-dashed h-full"></div>
<div class="border-l border-chart-grid border-dashed h-full"></div>
<div class="border-l border-chart-grid border-dashed h-full"></div>
<div class="border-l border-chart-grid border-dashed h-full"></div>
</div>
<!-- Bars -->
<div class="absolute inset-x-md bottom-6 top-2 flex items-end justify-start gap-1 px-2 z-10">
<!-- J -->
<div class="w-4 h-[40%] bg-brand-orange rounded-t-sm"></div>
<!-- A -->
<div class="w-4 h-[90%] bg-brand-orange rounded-t-sm"></div>
<!-- Empty slots for spacing to match image -->
</div>
<!-- X Axis Labels -->
<div class="absolute bottom-0 inset-x-md flex justify-between text-secondary text-[10px] px-2 font-medium">
<span>J</span>
<span>A</span>
<span>S</span>
<span>O</span>
<span>N</span>
<span>D</span>
</div>
</div>
<!-- Segmented Controls -->
<div class="px-md space-y-3">
<!-- Timeframe Control -->
<div class="flex bg-surface-container-high rounded-full p-1 segmented-control">
<div class="flex-1">
<input class="sr-only" id="tf-m" name="timeframe" type="radio"/>
<label class="block w-full text-center py-2 text-secondary text-body-sm rounded-full cursor-pointer transition-colors" for="tf-m">M</label>
</div>
<div class="flex-1">
<input class="sr-only" id="tf-6m" name="timeframe" type="radio"/>
<label class="block w-full text-center py-2 text-secondary text-body-sm rounded-full cursor-pointer transition-colors" for="tf-6m">6M</label>
</div>
<div class="flex-1">
<input checked="" class="sr-only" id="tf-y" name="timeframe" type="radio"/>
<label class="block w-full text-center py-2 text-on-surface bg-surface-container-highest font-medium text-body-sm rounded-full cursor-pointer transition-colors shadow-sm" for="tf-y">Y</label>
</div>
</div>
<!-- Data Type Control -->
<div class="flex bg-surface-container-high rounded-full p-1 segmented-control">
<div class="flex-1">
<input class="sr-only" id="dt-sets" name="datatype" type="radio"/>
<label class="block w-full text-center py-2 text-secondary text-body-sm rounded-full cursor-pointer transition-colors" for="dt-sets">Sets</label>
</div>
<div class="flex-1">
<input checked="" class="sr-only" id="dt-stats" name="datatype" type="radio"/>
<label class="block w-full text-center py-2 text-on-surface bg-surface-container-highest font-medium text-body-sm rounded-full cursor-pointer transition-colors shadow-sm" for="dt-stats">Stats</label>
</div>
</div>
</div>
</main>
<!-- BottomNavBar Navigation Shell -->
<nav class="fixed bottom-0 left-0 w-full md:absolute flex justify-around items-center px-md pb-xs pt-xs bg-surface-container border-t border-outline-variant z-40 rounded-t-xl h-nav-height">
<button class="flex flex-col items-center justify-center text-secondary p-2 hover:text-on-surface-variant transition-colors group">
<div class="px-4 py-1 rounded-full group-hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined">exercise</span>
</div>
<span class="font-label-caps text-label-caps mt-1">Sets</span>
</button>
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1 scale-95 transition-transform duration-150">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">timer</span>
<span class="font-label-caps text-label-caps mt-1">Sessions</span>
</button>
<button class="flex flex-col items-center justify-center text-secondary p-2 hover:text-on-surface-variant transition-colors group">
<div class="px-4 py-1 rounded-full group-hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined">accessibility_new</span>
</div>
<span class="font-label-caps text-label-caps mt-1">Body</span>
</button>
<button class="flex flex-col items-center justify-center text-secondary p-2 hover:text-on-surface-variant transition-colors group">
<div class="px-4 py-1 rounded-full group-hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined">event_note</span>
</div>
<span class="font-label-caps text-label-caps mt-1">Today</span>
</button>
</nav>
<!-- Multisets Modal Overlay -->
<div class="absolute inset-0 z-50 flex flex-col justify-end pointer-events-none">
<!-- Modal Background Dim -->
<div class="absolute inset-0 modal-backdrop pointer-events-auto"></div>
<!-- Modal Content -->
<div class="bg-surface-container-high rounded-t-[32px] w-full min-h-[400px] flex flex-col pointer-events-auto relative mt-20 shadow-2xl transform transition-transform border border-surface-variant">
<!-- Drag Handle -->
<div class="w-full flex justify-center pt-3 pb-1">
<div class="w-12 h-1.5 bg-tertiary-container rounded-full opacity-50"></div>
</div>
<!-- Modal Header -->
<div class="px-md py-3 flex justify-between items-center">
<button class="text-on-surface font-headline-md text-headline-md font-medium">Done</button>
<h3 class="font-headline-md text-headline-md text-on-surface absolute left-1/2 -translate-x-1/2">Multisets</h3>
<button class="w-10 h-10 rounded-full bg-brand-red flex items-center justify-center text-white shadow-lg hover:bg-brand-red-light transition-colors">
<span class="material-symbols-outlined text-[24px]">add</span>
</button>
</div>
<!-- Empty State Content -->
<div class="flex-1 flex flex-col items-center justify-center px-lg pb-10 text-center">
<!-- Stacked Icon Illustration -->
<div class="mb-6 text-tertiary-container opacity-80">
<span class="material-symbols-outlined text-[64px]" style="font-variation-settings: 'FILL' 1;">layers</span>
</div>
<h4 class="font-headline-md text-headline-md text-on-surface mb-2">No Multisets</h4>
<p class="text-secondary text-body-sm font-body-sm mb-8 max-w-[250px]">
                        Build a superset, dropset, or multiset with Bench Press and log every set together.
                    </p>
<button class="bg-brand-red hover:bg-brand-red-light text-white font-headline-md text-[16px] font-semibold py-3 px-8 rounded-full w-full max-w-[280px] transition-colors shadow-lg">
                        Add Multiset
                    </button>
</div>
</div>
</div>
</div>
</body></html>
