<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Advanced Data Entry Keypad</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        @import url('https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&display=swap');
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-tint": "#53e16f",
                        "tertiary": "#cbc8cb",
                        "error-container": "#93000a",
                        "on-surface-variant": "#bccbb8",
                        "on-tertiary-fixed-variant": "#474649",
                        "on-primary": "#003911",
                        "on-background": "#e2e2e2",
                        "tertiary-fixed-dim": "#c8c6c8",
                        "on-secondary": "#303032",
                        "on-primary-container": "#004d1a",
                        "surface-container-high": "#2a2a2a",
                        "primary-container": "#34c759",
                        "outline-variant": "#3d4a3c",
                        "surface-container": "#1f1f1f",
                        "secondary-container": "#474649",
                        "on-tertiary-fixed": "#1b1b1d",
                        "on-tertiary-container": "#414143",
                        "on-secondary-fixed": "#1b1b1d",
                        "on-error-container": "#ffdad6",
                        "primary-fixed-dim": "#53e16f",
                        "on-primary-fixed-variant": "#00531c",
                        "tertiary-fixed": "#e4e2e4",
                        "tertiary-container": "#afadaf",
                        "inverse-surface": "#e2e2e2",
                        "secondary-fixed-dim": "#c8c6c8",
                        "surface-container-highest": "#353535",
                        "on-error": "#690005",
                        "surface-container-lowest": "#0e0e0e",
                        "on-surface": "#e2e2e2",
                        "primary": "#56e472",
                        "surface-variant": "#353535",
                        "surface-bright": "#393939",
                        "error": "#ffb4ab",
                        "outline": "#869584",
                        "primary-fixed": "#72fe88",
                        "inverse-on-surface": "#303030",
                        "on-primary-fixed": "#002107",
                        "inverse-primary": "#006e28",
                        "on-tertiary": "#303032",
                        "surface": "#131313",
                        "on-secondary-container": "#b6b4b7",
                        "surface-container-low": "#1b1b1b",
                        "on-secondary-fixed-variant": "#474649",
                        "secondary": "#c8c6c8",
                        "background": "#131313",
                        "secondary-fixed": "#e4e2e4",
                        "surface-dim": "#131313",
                        "accent-orange": "#f97316" // Adding the distinct orange from the image
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px",
                        "3xl": "1.5rem"
                    },
                    "spacing": {
                        "lg": "24px",
                        "xl": "32px",
                        "md": "16px",
                        "xs": "8px",
                        "container-padding": "16px",
                        "base": "4px",
                        "sm": "12px",
                        "card-gap": "12px"
                    },
                    "fontFamily": {
                        "headline-md": ["Hanken Grotesk"],
                        "body-lg": ["Hanken Grotesk"],
                        "body-sm": ["Hanken Grotesk"],
                        "display-metrics": ["Hanken Grotesk"],
                        "headline-lg-mobile": ["Hanken Grotesk"],
                        "headline-lg": ["Hanken Grotesk"],
                        "label-caps": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-lg": ["17px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "display-metrics": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "headline-lg-mobile": ["26px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-lg">
<!-- Mock Background Content to show context -->
<div class="flex-1 p-md opacity-30 pointer-events-none">
<div class="flex justify-between items-center mb-xl">
<span class="material-symbols-outlined text-secondary">arrow_back_ios</span>
<h1 class="font-headline-md text-headline-md">Bench Press</h1>
<div class="flex gap-4">
<span class="material-symbols-outlined text-secondary">sort</span>
<span class="material-symbols-outlined text-secondary">more_horiz</span>
</div>
</div>
<div class="flex gap-2 mb-xl">
<button class="bg-surface-container-high rounded-full px-4 py-2 flex items-center gap-2 font-bold"><span class="material-symbols-outlined text-sm">view_list</span> Sets</button>
<button class="bg-surface-container rounded-full px-4 py-2 flex items-center gap-2 text-secondary"><span class="material-symbols-outlined text-sm">show_chart</span> Analyze</button>
<button class="bg-surface-container rounded-full px-4 py-2 flex items-center gap-2 text-secondary"><span class="material-symbols-outlined text-sm">target</span> 1RM</button>
</div>
<div class="space-y-4">
<p class="text-secondary text-sm">Yesterday &gt;</p>
<div class="flex justify-between items-center p-4 bg-surface-container rounded-xl">
<span class="text-secondary text-sm">1</span>
<span class="text-secondary text-sm">12:16 AM</span>
<span class="text-primary font-bold">12 rep</span>
<span class="text-accent-orange font-bold">35 kg &gt;</span>
</div>
</div>
</div>
<!-- Bottom Sheet Overlay -->
<div aria-hidden="true" class="fixed inset-0 bg-black/50 z-40 backdrop-blur-sm"></div>
<!-- Bottom Sheet Container -->
<div class="fixed bottom-0 left-0 right-0 w-full max-w-md mx-auto bg-surface-container-high rounded-t-3xl z-50 shadow-2xl flex flex-col pb-6 border-t border-surface-variant">
<!-- Drag Handle -->
<div class="w-full flex justify-center pt-3 pb-4">
<div class="w-12 h-1.5 bg-surface-variant rounded-full"></div>
</div>
<!-- Header / Value Display -->
<div class="px-lg flex items-center justify-between mb-6">
<div class="flex items-baseline gap-6">
<!-- Reps -->
<div class="flex items-baseline">
<span class="font-display-metrics text-display-metrics text-on-surface">12</span>
<span class="text-secondary ml-1 font-body-lg">rep</span>
</div>
<!-- Divider -->
<div class="text-surface-variant text-3xl font-light">|</div>
<!-- Weight (Active) -->
<div class="flex items-baseline relative">
<div class="absolute -left-4 top-1/2 -translate-y-1/2 w-2.5 h-2.5 bg-accent-orange rounded-full shadow-[0_0_8px_rgba(249,115,22,0.6)]"></div>
<span class="font-display-metrics text-display-metrics text-on-surface">35</span>
<span class="text-secondary ml-1 font-body-lg">kg</span>
</div>
</div>
<!-- Quick Adjustments -->
<div class="flex flex-col gap-2">
<div class="flex items-center gap-3 text-secondary font-headline-md bg-surface rounded-lg px-3 py-1 border border-surface-variant">
<button class="hover:text-on-surface transition-colors">-</button>
<span class="text-on-surface">1</span>
<button class="hover:text-on-surface transition-colors">+</button>
</div>
<div class="flex items-center gap-3 text-secondary font-headline-md bg-surface rounded-lg px-3 py-1 border border-surface-variant">
<button class="hover:text-on-surface transition-colors">-</button>
<span class="text-on-surface">5</span>
<button class="hover:text-on-surface transition-colors">+</button>
</div>
</div>
</div>
<!-- Action Pills Row (Scrollable) -->
<div class="w-full overflow-x-auto no-scrollbar mb-6 px-lg">
<div class="flex gap-3 min-w-max">
<button class="flex items-center gap-2 bg-surface px-4 py-2 rounded-full border border-surface-variant hover:bg-surface-bright transition-colors">
<span class="material-symbols-outlined text-accent-orange text-sm" style="font-variation-settings: 'FILL' 1;">label</span>
<span class="text-sm font-medium text-secondary">Label</span>
</button>
<button class="flex items-center gap-2 bg-surface px-4 py-2 rounded-full border border-surface-variant hover:bg-surface-bright transition-colors">
<span class="material-symbols-outlined text-accent-orange text-sm" style="font-variation-settings: 'FILL' 1;">stars</span>
<span class="text-sm font-medium text-secondary">Plates</span>
</button>
<button class="flex items-center gap-2 bg-surface px-4 py-2 rounded-full border border-surface-variant hover:bg-surface-bright transition-colors">
<span class="material-symbols-outlined text-accent-orange text-sm" style="font-variation-settings: 'FILL' 1;">fitness_center</span>
<span class="text-sm font-medium text-secondary">Weight</span>
</button>
<button class="flex items-center gap-2 bg-surface px-4 py-2 rounded-full border border-surface-variant hover:bg-surface-bright transition-colors">
<span class="material-symbols-outlined text-accent-orange text-sm" style="font-variation-settings: 'FILL' 1;">scale</span>
<span class="text-sm font-medium text-secondary">KG</span>
</button>
<button class="flex items-center gap-2 bg-surface px-4 py-2 rounded-full border border-surface-variant hover:bg-surface-bright transition-colors">
<span class="material-symbols-outlined text-accent-orange text-sm" style="font-variation-settings: 'FILL' 1;">schedule</span>
<span class="text-sm font-medium text-secondary">Now</span>
</button>
</div>
</div>
<!-- Note Input and Submit Button -->
<div class="flex items-center gap-4 px-lg mb-6">
<input class="flex-1 bg-transparent border-none text-on-surface placeholder-secondary focus:ring-0 text-lg px-0 py-2" placeholder="Add note" type="text"/>
<button class="bg-primary-container text-on-primary-container rounded-full h-12 w-32 flex items-center justify-center hover:opacity-90 active:scale-95 transition-all shadow-[0_4px_14px_rgba(52,199,89,0.2)]">
<span class="material-symbols-outlined font-bold text-2xl">check</span>
</button>
</div>
<!-- Keypad -->
<div class="grid grid-cols-3 gap-2 px-md">
<button class="bg-surface hover:bg-surface-bright active:bg-surface-variant text-on-surface font-headline-lg text-headline-lg py-3 rounded-lg transition-colors border border-surface-variant/50">1</button>
<button class="bg-surface hover:bg-surface-bright active:bg-surface-variant text-on-surface font-headline-lg text-headline-lg py-3 rounded-lg transition-colors border border-surface-variant/50">2</button>
<button class="bg-surface hover:bg-surface-bright active:bg-surface-variant text-on-surface font-headline-lg text-headline-lg py-3 rounded-lg transition-colors border border-surface-variant/50">3</button>
<button class="bg-surface hover:bg-surface-bright active:bg-surface-variant text-on-surface font-headline-lg text-headline-lg py-3 rounded-lg transition-colors border border-surface-variant/50">4</button>
<button class="bg-surface hover:bg-surface-bright active:bg-surface-variant text-on-surface font-headline-lg text-headline-lg py-3 rounded-lg transition-colors border border-surface-variant/50">5</button>
<button class="bg-surface hover:bg-surface-bright active:bg-surface-variant text-on-surface font-headline-lg text-headline-lg py-3 rounded-lg transition-colors border border-surface-variant/50">6</button>
<button class="bg-surface hover:bg-surface-bright active:bg-surface-variant text-on-surface font-headline-lg text-headline-lg py-3 rounded-lg transition-colors border border-surface-variant/50">7</button>
<button class="bg-surface hover:bg-surface-bright active:bg-surface-variant text-on-surface font-headline-lg text-headline-lg py-3 rounded-lg transition-colors border border-surface-variant/50">8</button>
<button class="bg-surface hover:bg-surface-bright active:bg-surface-variant text-on-surface font-headline-lg text-headline-lg py-3 rounded-lg transition-colors border border-surface-variant/50">9</button>
<button class="bg-transparent hover:bg-surface-bright active:bg-surface-variant text-on-surface font-headline-lg text-headline-lg py-3 rounded-lg transition-colors flex items-center justify-center">
<span class="material-symbols-outlined">keyboard</span>
</button>
<button class="bg-surface hover:bg-surface-bright active:bg-surface-variant text-on-surface font-headline-lg text-headline-lg py-3 rounded-lg transition-colors border border-surface-variant/50">0</button>
<button class="bg-surface hover:bg-surface-bright active:bg-surface-variant text-on-surface font-headline-lg text-headline-lg py-3 rounded-lg transition-colors border border-surface-variant/50 flex items-center justify-center">
<span class="material-symbols-outlined">backspace</span>
</button>
</div>
</div>
<style>
        /* Hide scrollbar for action pills */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</body></html>
