<body class="font-body-lg antialiased flex flex-col h-screen overflow-hidden">

</button>
<h1 class="font-headline-md text-headline-md text-on-surface">Bench Press</h1>
<div class="flex gap-xs">
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container hover:bg-surface-container-high transition-colors text-on-surface">
<span class="material-symbols-outlined">sort</span>
</button>

<span class="material-symbols-outlined text-[18px]">monitoring</span>

            </button>
<button class="flex-1 flex items-center justify-center gap-2 py-2 rounded-full bg-surface-container text-secondary font-headline-md text-sm hover:bg-surface-container-high transition-colors">

</div>

</div>
<div class="flex flex-col items-center justify-center py-sm rounded-lg bg-surface-container text-secondary border border-surface-container-high">

</div>

<span class="font-body-sm text-[10px] font-bold">Volume</span>
</div>
</div>

</div>

<div class="border-t border-surface-container-high border-dashed opacity-50 w-[calc(100%-40px)]"></div>
<div class="border-t border-surface-container-high border-dashed opacity-50 w-[calc(100%-40px)]"></div>

<span>0</span>

<div class="flex flex-col items-center gap-1 h-0 w-6">

<div class="flex flex-col items-center gap-1 h-0 w-6">
<div class="w-2 bg-[cyan] rounded-t-sm h-full opacity-50"></div>
</div>
</div>

<button class="flex-1 py-2 rounded-full bg-surface-container-high text-on-surface font-headline-md text-sm shadow-sm">Y</button>
