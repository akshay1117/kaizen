<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>1RM Manual Entry</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary": "#303032",
                        "on-secondary-container": "#b6b4b7",
                        "surface-container-lowest": "#0e0e0e",
                        "on-secondary-fixed-variant": "#474649",
                        "primary": "#56e472",
                        "secondary-container": "#474649",
                        "on-surface": "#e2e2e2",
                        "on-tertiary-container": "#414143",
                        "on-tertiary-fixed": "#1b1b1d",
                        "secondary": "#c8c6c8",
                        "on-primary": "#003911",
                        "primary-fixed-dim": "#53e16f",
                        "on-tertiary": "#303032",
                        "on-primary-container": "#004d1a",
                        "surface-container-high": "#2a2a2a",
                        "on-secondary-fixed": "#1b1b1d",
                        "tertiary-fixed-dim": "#c8c6c8",
                        "tertiary": "#cbc8cb",
                        "surface-dim": "#131313",
                        "surface-variant": "#353535",
                        "on-surface-variant": "#bccbb8",
                        "inverse-primary": "#006e28",
                        "tertiary-fixed": "#e4e2e4",
                        "secondary-fixed": "#e4e2e4",
                        "inverse-on-surface": "#303030",
                        "outline": "#869584",
                        "surface-container-highest": "#353535",
                        "tertiary-container": "#afadaf",
                        "surface-tint": "#53e16f",
                        "surface-container": "#1f1f1f",
                        "on-error": "#690005",
                        "error-container": "#93000a",
                        "outline-variant": "#3d4a3c",
                        "on-background": "#e2e2e2",
                        "on-error-container": "#ffdad6",
                        "background": "#131313",
                        "surface": "#131313",
                        "on-tertiary-fixed-variant": "#474649",
                        "inverse-surface": "#e2e2e2",
                        "surface-container-low": "#1b1b1b",
                        "primary-fixed": "#72fe88",
                        "on-primary-fixed": "#002107",
                        "error": "#ffb4ab",
                        "primary-container": "#34c759",
                        "secondary-fixed-dim": "#c8c6c8",
                        "surface-bright": "#393939",
                        "on-primary-fixed-variant": "#00531c"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base": "4px",
                        "md": "16px",
                        "card-gap": "12px",
                        "container-padding": "16px",
                        "xs": "8px",
                        "lg": "24px",
                        "xl": "32px",
                        "sm": "12px"
                    },
                    "fontFamily": {
                        "label-caps": ["Hanken Grotesk"],
                        "headline-lg": ["Hanken Grotesk"],
                        "body-sm": ["Hanken Grotesk"],
                        "body-lg": ["Hanken Grotesk"],
                        "display-metrics": ["Hanken Grotesk"],
                        "headline-lg-mobile": ["Hanken Grotesk"],
                        "headline-md": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "body-lg": ["17px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display-metrics": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "headline-lg-mobile": ["26px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Hanken Grotesk', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface h-screen w-full overflow-hidden flex flex-col relative">
<!-- Background Context (Dimmed) -->
<div class="absolute inset-0 z-0 opacity-40 pointer-events-none flex flex-col pt-20 px-md">
<div class="w-full flex justify-between items-center mb-6">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile">Bench Press</h1>
</div>
<div class="bg-surface-container rounded-lg p-md border border-outline-variant mb-card-gap">
<p class="font-body-lg text-body-lg text-secondary mb-2">Current 1RM</p>
<div class="font-display-metrics text-display-metrics text-primary">105 kg</div>
</div>
<!-- Mock graph -->
<div class="w-full h-48 bg-surface-container rounded-lg border border-outline-variant mt-4 flex items-end p-4 gap-2">
<div class="w-1/6 bg-secondary-container h-1/3 rounded-t"></div>
<div class="w-1/6 bg-secondary-container h-1/2 rounded-t"></div>
<div class="w-1/6 bg-secondary-container h-2/3 rounded-t"></div>
<div class="w-1/6 bg-primary-container h-3/4 rounded-t"></div>
<div class="w-1/6 bg-primary-container h-full rounded-t"></div>
</div>
</div>
<!-- Modal Backdrop -->
<div class="absolute inset-0 bg-black/70 z-40 transition-opacity" id="backdrop"></div>
<!-- Bottom Sheet -->
<div class="absolute bottom-0 left-0 w-full bg-surface-container rounded-t-[24px] z-50 flex flex-col transform transition-transform duration-300 ease-out translate-y-0" id="bottomSheet" style="height: 85vh;">
<!-- Drag Indicator -->
<div class="w-full flex justify-center pt-3 pb-5">
<div class="w-12 h-1.5 bg-outline-variant rounded-full"></div>
</div>
<!-- Header Actions -->
<div class="px-md flex justify-between items-center mb-lg">
<button class="bg-surface-variant hover:bg-secondary-container transition-colors rounded-full px-4 py-2 flex items-center border border-outline-variant">
<span class="font-body-sm text-body-sm text-on-surface font-semibold">Turn Off</span>
</button>
<div class="font-headline-md text-headline-md">1RM Entry</div>
<div class="w-20"></div> <!-- Spacer for centering -->
</div>
<!-- Scrollable Content -->
<div class="flex-1 overflow-y-auto px-md pb-xl flex flex-col gap-lg">
<!-- Manual Entry Card -->
<div class="bg-surface rounded-xl p-md border border-outline-variant">
<h3 class="font-label-caps text-label-caps text-secondary mb-4 uppercase tracking-wider">Manual Entry</h3>
<div class="relative">
<input class="w-full bg-surface-container border border-outline-variant rounded-lg px-4 py-3 h-[56px] font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary placeholder-secondary/50" placeholder="Enter 1RM" type="number"/>
<span class="absolute right-4 top-1/2 -translate-y-1/2 font-body-lg text-body-lg text-secondary">kg</span>
</div>
</div>
<!-- Estimate Card -->
<div class="bg-surface rounded-xl p-md border border-outline-variant">
<h3 class="font-label-caps text-label-caps text-secondary mb-4 uppercase tracking-wider flex items-center gap-2">
<span class="material-symbols-outlined text-[16px]" data-icon="calculate">calculate</span>
                    Estimate 1RM from set
                </h3>
<div class="flex flex-col gap-4">
<div class="flex items-center gap-4">
<div class="flex-1">
<label class="block font-body-sm text-body-sm text-secondary mb-1">Repetitions</label>
<input class="w-full bg-surface-container border border-outline-variant rounded-lg px-4 py-3 h-[56px] font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary placeholder-secondary/50" placeholder="Enter amount" type="number"/>
</div>
<span class="material-symbols-outlined text-secondary mt-6" data-icon="close">close</span>
<div class="flex-1">
<label class="block font-body-sm text-body-sm text-secondary mb-1">Weight</label>
<div class="relative">
<input class="w-full bg-surface-container border border-outline-variant rounded-lg px-4 py-3 h-[56px] font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary placeholder-secondary/50" placeholder="Enter amount" type="number"/>
<span class="absolute right-4 top-1/2 -translate-y-1/2 font-body-lg text-body-lg text-secondary">kg</span>
</div>
</div>
</div>
</div>
</div>
<!-- Footer Text -->
<p class="font-body-sm text-body-sm text-secondary text-center px-4 mt-auto">
                Plug in a maximum effort set to get an estimated 1RM calculated using the Brzycki formula.
            </p>
<!-- Save Button (Fixed at bottom of content) -->
<button class="w-full h-[56px] bg-primary-container text-white font-headline-md text-headline-md rounded-lg flex items-center justify-center hover:bg-primary-fixed-dim transition-colors mt-4">
                Save 1RM
            </button>
</div>
</div>
</body></html>
