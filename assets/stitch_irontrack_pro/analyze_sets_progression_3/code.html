<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Workout Analysis</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "secondary": "#c8c6c8",
                        "surface-tint": "#53e16f",
                        "on-error-container": "#ffdad6",
                        "surface-container-highest": "#353535",
                        "on-surface-variant": "#bccbb8",
                        "secondary-fixed": "#e4e2e4",
                        "inverse-primary": "#006e28",
                        "on-surface": "#e2e2e2",
                        "surface-variant": "#353535",
                        "primary-fixed-dim": "#53e16f",
                        "surface-container-low": "#1b1b1b",
                        "tertiary-container": "#afadaf",
                        "error-container": "#93000a",
                        "outline": "#869584",
                        "on-background": "#e2e2e2",
                        "primary-container": "#34c759",
                        "surface": "#131313",
                        "on-tertiary-fixed": "#1b1b1d",
                        "on-tertiary": "#303032",
                        "on-primary-container": "#004d1a",
                        "primary": "#56e472",
                        "on-primary-fixed": "#002107",
                        "secondary-container": "#474649",
                        "on-tertiary-fixed-variant": "#474649",
                        "primary-fixed": "#72fe88",
                        "background": "#000000", /* Customized for pure black canvas */
                        "outline-variant": "#3d4a3c",
                        "surface-container": "#1c1c1e", /* Adjusted based on guidance */
                        "error": "#ffb4ab",
                        "tertiary": "#cbc8cb",
                        "inverse-surface": "#e2e2e2",
                        "tertiary-fixed": "#e4e2e4",
                        "on-tertiary-container": "#414143",
                        "surface-container-lowest": "#0e0e0e",
                        "on-error": "#690005",
                        "on-primary-fixed-variant": "#00531c",
                        "inverse-on-surface": "#303030",
                        "on-secondary-fixed": "#1b1b1d",
                        "on-secondary-container": "#b6b4b7",
                        "on-secondary": "#303032",
                        "on-secondary-fixed-variant": "#474649",
                        "on-primary": "#003911",
                        "surface-container-high": "#2c2c2e", /* Adjusted for interactions */
                        "tertiary-fixed-dim": "#c8c6c8",
                        "surface-bright": "#393939",
                        "surface-dim": "#131313",
                        "secondary-fixed-dim": "#c8c6c8"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "xs": "8px",
                        "container-padding": "16px",
                        "card-gap": "12px",
                        "lg": "24px",
                        "xl": "32px",
                        "base": "4px",
                        "md": "16px",
                        "sm": "12px"
                    },
                    fontFamily: {
                        "body-lg": ["Hanken Grotesk"],
                        "headline-lg": ["Hanken Grotesk"],
                        "label-caps": ["Hanken Grotesk"],
                        "body-sm": ["Hanken Grotesk"],
                        "headline-md": ["Hanken Grotesk"],
                        "display-metrics": ["Hanken Grotesk"],
                        "headline-lg-mobile": ["Hanken Grotesk"]
                    },
                    fontSize: {
                        "body-lg": ["17px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "display-metrics": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "headline-lg-mobile": ["26px", { "lineHeight": "32px", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        body { background-color: #000000; color: #ffffff; }
        .chart-grid { stroke: #2C2C2E; stroke-width: 1; stroke-dasharray: 4 4; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-body-lg text-on-surface antialiased min-h-screen flex flex-col pt-16 pb-24">
<!-- Top App Bar -->
<header class="fixed top-0 left-0 w-full z-40 bg-background flex justify-between items-center px-md py-xs h-14">
<button class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-on-surface text-xl">arrow_back_ios_new</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface">Bench Press</h1>
<div class="flex gap-2">
<button class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-on-surface text-xl">sort</span>
</button>
<button class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-on-surface text-xl">more_horiz</span>
</button>
</div>
</header>
<main class="flex-1 w-full max-w-md mx-auto px-md flex flex-col gap-6 pt-4">
<!-- Tab Navigation (Sets / Analyze / 1RM) -->
<div class="flex gap-2 bg-surface-container p-1 rounded-full w-full max-w-sm mx-auto">
<button class="flex-1 py-2 px-4 rounded-full text-secondary font-body-sm text-body-sm flex items-center justify-center gap-2 hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-sm">fitness_center</span>
                Sets
            </button>
<button class="flex-1 py-2 px-4 rounded-full bg-white text-black font-body-sm text-body-sm font-bold flex items-center justify-center gap-2 shadow-sm">
<span class="material-symbols-outlined text-sm">show_chart</span>
                Analyze
            </button>
<button class="flex-1 py-2 px-4 rounded-full text-secondary font-body-sm text-body-sm flex items-center justify-center gap-2 hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-sm">workspace_premium</span>
                1RM
            </button>
</div>
<!-- Metrics Display -->
<div class="text-center flex flex-col items-center justify-center mt-4">
<div class="flex items-baseline gap-2 justify-center">
<span class="font-headline-lg-mobile text-headline-lg-mobile text-[#34C759]">12 rep</span>
<span class="font-headline-lg-mobile text-headline-lg-mobile text-[#FF9500]">35 kg</span>
</div>
<p class="font-body-sm text-body-sm text-secondary mt-1">Last Set: 03/08/26, 12:16 AM</p>
</div>
<!-- Line Chart Container -->
<div class="relative w-full aspect-[4/5] mt-4 flex-1">
<!-- Simulated Chart SVG -->
<svg class="w-full h-full" viewbox="0 0 400 500">
<!-- Grid Lines -->
<line class="chart-grid" x1="10%" x2="90%" y1="20%" y2="20%"></line>
<line class="chart-grid" x1="10%" x2="90%" y1="40%" y2="40%"></line>
<line class="chart-grid" x1="10%" x2="90%" y1="60%" y2="60%"></line>
<line class="chart-grid" x1="10%" x2="90%" y1="80%" y2="80%"></line>
<line class="chart-grid" x1="30%" x2="30%" y1="10%" y2="90%"></line>
<line class="chart-grid" x1="50%" x2="50%" y1="10%" y2="90%"></line>
<line class="chart-grid" x1="70%" x2="70%" y1="10%" y2="90%"></line>
<!-- Green Baseline -->
<polyline fill="none" points="10%,80% 30%,80% 50%,80% 70%,80% 90%,80%" stroke="#34C759" stroke-width="3"></polyline>
<circle cx="10%" cy="80%" fill="#000" r="4" stroke="#34C759" stroke-width="2"></circle>
<circle cx="30%" cy="80%" fill="#000" r="4" stroke="#34C759" stroke-width="2"></circle>
<circle cx="50%" cy="80%" fill="#000" r="4" stroke="#34C759" stroke-width="2"></circle>
<circle cx="70%" cy="80%" fill="#000" r="4" stroke="#34C759" stroke-width="2"></circle>
<circle cx="90%" cy="80%" fill="#000" r="4" stroke="#34C759" stroke-width="2"></circle>
<!-- Orange Trend Line -->
<polyline fill="none" points="10%,75% 30%,75% 50%,75% 70%,45% 90%,15%" stroke="#FF9500" stroke-width="3"></polyline>
<circle cx="10%" cy="75%" fill="#000" r="4" stroke="#FF9500" stroke-width="2"></circle>
<circle cx="30%" cy="75%" fill="#000" r="4" stroke="#FF9500" stroke-width="2"></circle>
<circle cx="50%" cy="75%" fill="#000" r="4" stroke="#FF9500" stroke-width="2"></circle>
<circle cx="70%" cy="45%" fill="#000" r="4" stroke="#FF9500" stroke-width="2"></circle>
<circle cx="90%" cy="15%" fill="#000" r="4" stroke="#FF9500" stroke-width="2"></circle>
</svg>
</div>
<!-- Segmented Controls Container -->
<div class="mt-auto flex flex-col gap-3 pb-6">
<!-- Timeframe Toggle -->
<div class="flex bg-surface-container rounded-xl p-1 w-full">
<button class="flex-1 py-2 px-4 rounded-lg text-secondary font-body-sm text-body-sm hover:bg-surface-container-high transition-colors">
                    Last 2 Sessions
                </button>
<button class="flex-1 py-2 px-4 rounded-lg bg-surface-container-high text-on-surface font-body-sm text-body-sm font-semibold shadow-sm">
                    All
                </button>
</div>
<!-- Sets/Stats Toggle -->
<div class="flex bg-surface-container rounded-xl p-1 w-full">
<button class="flex-1 py-2 px-4 rounded-lg bg-surface-container-high text-on-surface font-body-sm text-body-sm font-semibold shadow-sm">
                    Sets
                </button>
<button class="flex-1 py-2 px-4 rounded-lg text-secondary font-body-sm text-body-sm hover:bg-surface-container-high transition-colors">
                    Stats
                </button>
</div>
</div>
</main>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 w-full z-50 bg-surface-container border-t border-outline-variant pb-xs pt-xs px-md flex justify-around items-center h-20 shadow-lg rounded-t-xl">
<a class="flex flex-col items-center justify-center text-primary-container p-2" href="#">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">exercise</span>
<span class="font-label-caps text-label-caps mt-1">Sets</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary p-2 hover:text-on-surface-variant transition-colors" href="#">
<span class="material-symbols-outlined text-2xl">timer</span>
<span class="font-label-caps text-label-caps mt-1">Sessions</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary p-2 hover:text-on-surface-variant transition-colors" href="#">
<span class="material-symbols-outlined text-2xl">accessibility_new</span>
<span class="font-label-caps text-label-caps mt-1">Body</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary p-2 hover:text-on-surface-variant transition-colors" href="#">
<span class="material-symbols-outlined text-2xl">event_note</span>
<span class="font-label-caps text-label-caps mt-1">Today</span>
</a>
</nav>
</body></html>
