<body class="antialiased min-h-screen flex flex-col pb-24 md:pb-0">
<!-- TopAppBar -->
<header class="bg-background dark:bg-background docked full-width top-0 bg-background dark:bg-background flex justify-between items-center w-full px-md h-14 z-50 sticky">
<button aria-label="Go Back" class="text-primary dark:text-primary hover:opacity-80 transition-opacity active:scale-95 transition-transform duration-150 p-2 flex items-center justify-center rounded-full">
<span class="material-symbols-outlined text-[24px]">chevron_left</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-on-surface dark:text-on-surface flex-1 text-center truncate">Workout</h1>
<button aria-label="Save" class="text-primary dark:text-primary hover:opacity-80 transition-opacity active:scale-95 transition-transform duration-150 p-2 flex items-center justify-center rounded-full bg-primary-container/20">
<span class="material-symbols-outlined text-[24px] text-primary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
</header>
<main class="flex-1 w-full max-w-2xl mx-auto px-md py-lg flex flex-col gap-card-gap">
<!-- Header Section (Local) -->
<div class="mb-sm">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Edit Set</h2>
</div>
<!-- Exercise Card -->
<div class="surface-card p-container-padding flex justify-between items-center cursor-pointer hover:bg-[#2C2C2E] transition-colors">
<div class="flex items-center gap-sm">
<div class="icon-box">
<span class="material-symbols-outlined text-secondary text-[20px]">fitness_center</span>
</div>
<div>
<div class="font-body-sm text-body-sm text-secondary">Exercise</div>
<div class="font-body-lg text-body-lg text-on-surface font-semibold">Bench Press</div>
</div>
</div>
<span class="material-symbols-outlined text-secondary">chevron_right</span>
</div>
<!-- Metrics Card Grid -->
<div class="grid grid-cols-2 gap-card-gap">
<div class="surface-card p-container-padding cursor-pointer hover:bg-[#2C2C2E] transition-colors flex flex-col gap-xs">
<div class="flex items-center gap-xs text-secondary">
<span class="material-symbols-outlined text-[18px]">repeat</span>
<span class="font-body-sm text-body-sm">Repetitions</span>
</div>
<div class="font-display-metrics text-display-metrics text-on-surface">12</div>
</div>
<div class="surface-card p-container-padding cursor-pointer hover:bg-[#2C2C2E] transition-colors flex flex-col gap-xs">
<div class="flex items-center gap-xs text-secondary">
<span class="material-symbols-outlined text-[18px]">scale</span>
<span class="font-body-sm text-body-sm">Weight (kg)</span>
</div>
<div class="font-display-metrics text-display-metrics text-primary">20</div>
</div>
</div>
<!-- Notes Card -->
<div class="surface-card p-container-padding flex flex-col gap-sm">
<div class="flex items-center gap-xs text-secondary">
<span class="material-symbols-outlined text-[18px]">notes</span>
<span class="font-body-sm text-body-sm">Notes</span>
</div>
<input class="w-full bg-transparent border-b border-[#2C2C2E] pb-2 text-on-surface font-body-lg text-body-lg focus:outline-none focus:border-primary focus:ring-0 placeholder-secondary" placeholder="Add a note..." type="text" value="Comment"/>
</div>
<!-- Label Card -->
<div class="surface-card p-container-padding flex justify-between items-center cursor-pointer hover:bg-[#2C2C2E] transition-colors">
<div class="flex items-center gap-sm">
<div class="icon-box">
<span class="material-symbols-outlined text-secondary text-[20px]">label</span>
</div>
<span class="font-body-lg text-body-lg text-on-surface">Label</span>
</div>
<span class="material-symbols-outlined text-secondary">chevron_right</span>
</div>
<!-- Date & Time Card -->
<div class="surface-card p-container-padding flex flex-col gap-md">
<div class="flex items-center gap-xs text-secondary mb-xs">
<span class="material-symbols-outlined text-[18px]">calendar_today</span>
<span class="font-body-sm text-body-sm">Timestamp</span>
</div>
<div class="flex gap-card-gap">
<button class="flex-1 bg-[#2C2C2E] rounded-lg py-3 px-4 font-body-lg text-body-lg text-on-surface text-center hover:bg-[#353535] transition-colors">26/07/26</button>
<button class="flex-1 bg-[#2C2C2E] rounded-lg py-3 px-4 font-body-lg text-body-lg text-on-surface text-center hover:bg-[#353535] transition-colors">8:51 AM</button>
</div>
<div class="font-body-sm text-body-sm text-secondary text-center">Exact Time: 8:51:12 AM</div>
</div>

<div class="flex-1 min-h-[32px]"></div>

<button class="w-full surface-card p-container-padding flex items-center justify-center gap-sm text-error hover:bg-error/10 transition-colors mt-auto">
<span class="material-symbols-outlined">delete</span>
<span class="font-body-lg text-body-lg font-semibold">Delete</span>
