<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>1RM Settings</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-secondary": "#303032",
                    "on-secondary-container": "#b6b4b7",
                    "surface-container-lowest": "#0e0e0e",
                    "on-secondary-fixed-variant": "#474649",
                    "primary": "#56e472",
                    "secondary-container": "#474649",
                    "on-surface": "#e2e2e2",
                    "on-tertiary-container": "#414143",
                    "on-tertiary-fixed": "#1b1b1d",
                    "secondary": "#c8c6c8",
                    "on-primary": "#003911",
                    "primary-fixed-dim": "#53e16f",
                    "on-tertiary": "#303032",
                    "on-primary-container": "#004d1a",
                    "surface-container-high": "#2a2a2a",
                    "on-secondary-fixed": "#1b1b1d",
                    "tertiary-fixed-dim": "#c8c6c8",
                    "tertiary": "#cbc8cb",
                    "surface-dim": "#131313",
                    "surface-variant": "#353535",
                    "on-surface-variant": "#bccbb8",
                    "inverse-primary": "#006e28",
                    "tertiary-fixed": "#e4e2e4",
                    "secondary-fixed": "#e4e2e4",
                    "inverse-on-surface": "#303030",
                    "outline": "#869584",
                    "surface-container-highest": "#353535",
                    "tertiary-container": "#afadaf",
                    "surface-tint": "#53e16f",
                    "surface-container": "#1f1f1f",
                    "on-error": "#690005",
                    "error-container": "#93000a",
                    "outline-variant": "#3d4a3c",
                    "on-background": "#e2e2e2",
                    "on-error-container": "#ffdad6",
                    "background": "#131313",
                    "surface": "#131313",
                    "on-tertiary-fixed-variant": "#474649",
                    "inverse-surface": "#e2e2e2",
                    "surface-container-low": "#1b1b1b",
                    "primary-fixed": "#72fe88",
                    "on-primary-fixed": "#002107",
                    "error": "#ffb4ab",
                    "primary-container": "#34c759",
                    "secondary-fixed-dim": "#c8c6c8",
                    "surface-bright": "#393939",
                    "on-primary-fixed-variant": "#00531c",
                    "custom-purple": "#AF52DE"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "base": "4px",
                    "md": "16px",
                    "card-gap": "12px",
                    "container-padding": "16px",
                    "xs": "8px",
                    "lg": "24px",
                    "xl": "32px",
                    "sm": "12px",
                    "safe": "env(safe-area-inset-bottom)"
            },
            "fontFamily": {
                    "label-caps": [
                            "Hanken Grotesk"
                    ],
                    "headline-lg": [
                            "Hanken Grotesk"
                    ],
                    "body-sm": [
                            "Hanken Grotesk"
                    ],
                    "body-lg": [
                            "Hanken Grotesk"
                    ],
                    "display-metrics": [
                            "Hanken Grotesk"
                    ],
                    "headline-lg-mobile": [
                            "Hanken Grotesk"
                    ],
                    "headline-md": [
                            "Hanken Grotesk"
                    ]
            },
            "fontSize": {
                    "label-caps": [
                            "12px",
                            {
                                    "lineHeight": "16px",
                                    "letterSpacing": "0.05em",
                                    "fontWeight": "700"
                            }
                    ],
                    "headline-lg": [
                            "32px",
                            {
                                    "lineHeight": "40px",
                                    "letterSpacing": "-0.01em",
                                    "fontWeight": "700"
                            }
                    ],
                    "body-sm": [
                            "14px",
                            {
                                    "lineHeight": "20px",
                                    "fontWeight": "400"
                            }
                    ],
                    "body-lg": [
                            "17px",
                            {
                                    "lineHeight": "24px",
                                    "fontWeight": "400"
                            }
                    ],
                    "display-metrics": [
                            "48px",
                            {
                                    "lineHeight": "56px",
                                    "letterSpacing": "-0.02em",
                                    "fontWeight": "800"
                            }
                    ],
                    "headline-lg-mobile": [
                            "26px",
                            {
                                    "lineHeight": "32px",
                                    "fontWeight": "700"
                            }
                    ],
                    "headline-md": [
                            "20px",
                            {
                                    "lineHeight": "28px",
                                    "fontWeight": "600"
                            }
                    ]
            }
          }
        }
      }
    </script>
<style type="text/tailwindcss">
        @layer utilities {
            .no-scrollbar::-webkit-scrollbar {
                display: none;
            }
            .no-scrollbar {
                -ms-overflow-style: none;
                scrollbar-width: none;
            }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface antialiased flex flex-col min-h-screen">
<!-- TopAppBar -->
<header class="flex justify-between items-center w-full px-md h-14 z-50 bg-background docked full-width top-0 sticky">
<button class="flex items-center justify-center w-10 h-10 text-primary hover:opacity-80 transition-opacity active:scale-95 duration-150">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">chevron_left</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-on-surface">Workout</h1>
<button class="flex items-center justify-center w-10 h-10 text-primary hover:opacity-80 transition-opacity active:scale-95 duration-150">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">check</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 overflow-y-auto no-scrollbar pb-[calc(64px+env(safe-area-inset-bottom))] px-md pt-sm">
<!-- Segmented Control -->
<div class="bg-surface-container-low rounded-xl p-1 flex mb-lg">
<button class="flex-1 py-2 font-body-sm text-body-sm text-secondary hover:text-on-surface transition-colors">Plate Calculator</button>
<button class="flex-1 py-2 font-body-sm text-body-sm text-secondary hover:text-on-surface transition-colors">Timer</button>
<button class="flex-1 py-2 bg-surface-variant rounded-lg font-body-sm text-body-sm text-on-surface font-semibold shadow-sm">1RM</button>
</div>
<!-- 1RM Settings List -->
<div class="mb-lg">
<h2 class="font-label-caps text-label-caps text-secondary uppercase mb-sm px-2">1RM Settings</h2>
<div class="bg-surface-container-low rounded-xl border border-surface-variant overflow-hidden flex flex-col divide-y divide-surface-variant">
<!-- Row 1: 1 Rep Max -->
<button class="w-full min-h-[56px] px-md py-sm flex items-center justify-between hover:bg-surface-variant/30 transition-colors active:bg-surface-variant/50">
<div class="flex items-center gap-md">
<div class="w-8 h-8 rounded-lg bg-surface-variant flex items-center justify-center text-[#AF52DE]">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">fitness_center</span>
</div>
<span class="font-body-lg text-body-lg text-on-surface">1 Rep Max</span>
</div>
<span class="font-body-lg text-body-lg text-[#AF52DE]">30 kg</span>
</button>
<!-- Row 2: Formula -->
<button class="w-full min-h-[56px] px-md py-sm flex items-center justify-between hover:bg-surface-variant/30 transition-colors active:bg-surface-variant/50">
<div class="flex items-center gap-md">
<div class="w-8 h-8 rounded-lg bg-surface-variant flex items-center justify-center text-secondary">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">functions</span>
</div>
<span class="font-body-lg text-body-lg text-on-surface">Formula</span>
</div>
<span class="material-symbols-outlined text-secondary">expand_more</span>
</button>
</div>
</div>
<!-- Formula List -->
<div class="bg-surface-container-low rounded-xl border border-surface-variant overflow-hidden flex flex-col divide-y divide-surface-variant">
<button class="w-full min-h-[56px] px-md py-sm flex items-center justify-between hover:bg-surface-variant/30 transition-colors">
<span class="font-body-lg text-body-lg text-on-surface">Epley</span>
</button>
<button class="w-full min-h-[56px] px-md py-sm flex items-center justify-between hover:bg-surface-variant/30 transition-colors">
<span class="font-body-lg text-body-lg text-on-surface">Brzycki</span>
</button>
<button class="w-full min-h-[56px] px-md py-sm flex items-center justify-between hover:bg-surface-variant/30 transition-colors">
<span class="font-body-lg text-body-lg text-on-surface">Lander</span>
</button>
<button class="w-full min-h-[56px] px-md py-sm flex items-center justify-between hover:bg-surface-variant/30 transition-colors">
<span class="font-body-lg text-body-lg text-on-surface">O'Connor</span>
</button>
<button class="w-full min-h-[56px] px-md py-sm flex items-center justify-between hover:bg-surface-variant/30 transition-colors bg-surface-variant/10">
<span class="font-body-lg text-body-lg text-on-surface font-semibold">Average</span>
<span class="material-symbols-outlined text-[#AF52DE]" style="font-variation-settings: 'FILL' 1;">check</span>
</button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-16 pb-safe px-4 bg-surface-container border-t border-outline-variant docked full-width">
<button class="flex flex-col items-center justify-center text-primary hover:bg-surface-variant/20 flex-1 h-full rounded-lg transition-colors active:scale-90 duration-200">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">fitness_center</span>
<span class="font-label-caps text-label-caps">Sets</span>
</button>
<button class="flex flex-col items-center justify-center text-secondary hover:bg-surface-variant/20 flex-1 h-full rounded-lg transition-colors">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">history</span>
<span class="font-label-caps text-label-caps">Sessions</span>
</button>
<button class="flex flex-col items-center justify-center text-secondary hover:bg-surface-variant/20 flex-1 h-full rounded-lg transition-colors">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">person</span>
<span class="font-label-caps text-label-caps">Body</span>
</button>
<button class="flex flex-col items-center justify-center text-secondary hover:bg-surface-variant/20 flex-1 h-full rounded-lg transition-colors">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">calendar_today</span>
<span class="font-label-caps text-label-caps">Today</span>
</button>
</nav>
</body></html>
